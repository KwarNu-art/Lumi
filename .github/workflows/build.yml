name: Build Lumi

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout Lumi (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          brew install ldid xz

      - name: Get Theos (fresh every build)
        run: |
          rm -rf "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Get iOS SDKs
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          ls "$THEOS/sdks"

      - name: Build package
        run: |
          make package FINALPACKAGE=1

      - name: List output
        run: ls -lh packages/

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-build
          path: packages/*.deb
          if-no-files-found: error
