name: Build Lumi

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Lumi
        uses: actions/checkout@v4

      - name: Set up Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-dir: theos
          theos-sdks: https://github.com/theos/sdks

      - name: Build Lumi
        run: make package

      - name: Upload Lumi package
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-build
          path: packages/*.deb
          if-no-files-found: error
